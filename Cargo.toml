[workspace]
members = [
    "crates/alphazero",
    "crates/core",
    "crates/random-bot",
    "crates/server",
    "crates/trainer",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
