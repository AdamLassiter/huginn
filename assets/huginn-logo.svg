<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Huginn</title>
  <desc id="desc">A raven perched across a golden hnefatafl pawn inside a time-orbit seal, beside the Huginn wordmark.</desc>
  <defs>
    <style>
      .wordmark { fill: #17232b; }
      .tagline { fill: #52646c; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #e7e1d4; }
        .tagline { fill: #9ba6aa; }
      }
    </style>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202f37"/>
      <stop offset="1" stop-color="#0c1217"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ca78"/>
      <stop offset="1" stop-color="#b98536"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93dadd"/>
      <stop offset="1" stop-color="#3a8f97"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#05090c" flood-opacity=".55"/>
    </filter>
    <clipPath id="seal-clip">
      <circle cx="200" cy="200" r="164"/>
    </clipPath>
  </defs>

  <!-- Time/timeline seal -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="172" fill="url(#seal)" stroke="#75c7c9" stroke-width="4"/>
    <circle cx="200" cy="200" r="154" fill="none" stroke="#39505a" stroke-width="2" stroke-dasharray="3 12"/>
    <path d="M45 200h310M200 45v310" clip-path="url(#seal-clip)" stroke="#75c7c9" stroke-opacity=".11" stroke-width="2"/>
    <path d="M68 112c73 30 191 30 264 0M68 288c73-30 191-30 264 0" clip-path="url(#seal-clip)" fill="none" stroke="#75c7c9" stroke-opacity=".10" stroke-width="2"/>
    <g fill="#d7aa52">
      <circle cx="200" cy="28" r="7"/>
      <circle cx="372" cy="200" r="7"/>
      <circle cx="200" cy="372" r="7"/>
      <circle cx="28" cy="200" r="7"/>
    </g>
  </g>

  <!-- Hnefatafl pawn -->
  <g fill="url(#gold)" stroke="#f5d58f" stroke-width="2" stroke-linejoin="round" filter="url(#shadow)">
    <circle cx="211" cy="158" r="38"/>
    <path d="M169 203c0-13 11-23 24-23h36c13 0 24 10 24 23v5h-84z"/>
    <path d="M184 208h54c0 41 11 64 31 86l-8 13H161l-8-13c20-22 31-45 31-86z"/>
    <path d="M151 307h120c11 0 20 9 20 20v7H131v-7c0-11 9-20 20-20z"/>
  </g>

  <!-- Raven silhouette -->
  <g stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)">
    <!-- Tail and body -->
    <path d="M82 262l-48 35 64-15-38 42 67-33-16 43 64-52c28-2 57-15 72-39 14-22 14-51 2-73-9-17-25-29-43-34-25-7-54-1-70 20-12 16-15 37-9 56-16 8-31 24-45 50z"
          fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <!-- Head, crown, and beak -->
    <path d="M205 148c0-32 17-65 46-79 26-13 57-6 73 18 8 13 9 29 3 44-9 23-31 40-57 44-26 4-52-6-65-27z"
          fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <path d="M319 89l55 35-57 10c8-14 9-30 2-45z" fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <!-- Wing -->
    <path d="M126 201c23-31 65-47 105-34 16 31 7 72-21 94-24 18-56 21-84 10 34-4 60-20 75-42-26 19-57 25-88 18 33-8 56-23 70-42-19 10-38 14-57 13z"
          fill="#111820" stroke="#75c7c9" stroke-width="3"/>
    <path d="M139 218c31 7 62-2 84-24M128 244c34 7 67-3 90-27M143 269c28 1 53-8 71-26"
          fill="none" stroke="#75c7c9" stroke-opacity=".7" stroke-width="4"/>
    <!-- Face and eye -->
    <path d="M251 79c19 1 37 10 47 25-15-7-31-8-46-2" fill="none" stroke="#75c7c9" stroke-width="6"/>
    <circle cx="288" cy="105" r="7" fill="#d7aa52" stroke="#f0ca78" stroke-width="2"/>
    <circle cx="290" cy="103" r="2" fill="#111820" stroke="none"/>
    <!-- Feet gripping the pawn -->
    <path d="M189 257c7 9 8 19 5 30m19-29c4 10 3 20-2 29m-28-1 11-5 8 6m1-1 10-5 8 5"
          fill="none" stroke="#d7aa52" stroke-width="6"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(430 0)">
    <path d="M0 112h6v176H0z" fill="#75c7c9" opacity=".55"/>
    <text class="wordmark" x="42" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" textLength="646" lengthAdjust="spacingAndGlyphs">HUGINN</text>
    <path d="M46 252h648" stroke="#d7aa52" stroke-width="4"/>
    <text class="tagline" x="48" y="292" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" textLength="642" lengthAdjust="spacingAndGlyphs">FIVE-DIMENSIONAL HNEFATAFL</text>
    <g transform="translate(48 322)" fill="#75c7c9">
      <circle cx="0" cy="0" r="4"/>
      <path d="M15 0h88" stroke="#75c7c9" stroke-width="2"/>
      <circle cx="118" cy="0" r="4"/>
      <path d="M133 0h88" stroke="#75c7c9" stroke-width="2"/>
      <circle cx="236" cy="0" r="4"/>
    </g>
  </g>
</svg>
