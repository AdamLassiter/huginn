<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Huginn raven and hnefatafl pawn</title>
  <desc id="desc">A dark raven perched across a golden hnefatafl pawn.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ca78"/>
      <stop offset="1" stop-color="#b98536"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#05090c" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Hnefatafl pawn -->
  <g fill="url(#gold)" stroke="#f5d58f" stroke-width="2" stroke-linejoin="round" filter="url(#shadow)">
    <circle cx="211" cy="158" r="38"/>
    <path d="M169 203c0-13 11-23 24-23h36c13 0 24 10 24 23v5h-84z"/>
    <path d="M184 208h54c0 41 11 64 31 86l-8 13H161l-8-13c20-22 31-45 31-86z"/>
    <path d="M151 307h120c11 0 20 9 20 20v7H131v-7c0-11 9-20 20-20z"/>
  </g>

  <!-- Raven -->
  <g stroke-linejoin="round" stroke-linecap="round" filter="url(#shadow)">
    <path d="M82 262l-48 35 64-15-38 42 67-33-16 43 64-52c28-2 57-15 72-39 14-22 14-51 2-73-9-17-25-29-43-34-25-7-54-1-70 20-12 16-15 37-9 56-16 8-31 24-45 50z"
          fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <path d="M205 148c0-32 17-65 46-79 26-13 57-6 73 18 8 13 9 29 3 44-9 23-31 40-57 44-26 4-52-6-65-27z"
          fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <path d="M319 89l55 35-57 10c8-14 9-30 2-45z" fill="#111820" stroke="#75c7c9" stroke-width="4"/>
    <path d="M126 201c23-31 65-47 105-34 16 31 7 72-21 94-24 18-56 21-84 10 34-4 60-20 75-42-26 19-57 25-88 18 33-8 56-23 70-42-19 10-38 14-57 13z"
          fill="#111820" stroke="#75c7c9" stroke-width="3"/>
    <path d="M139 218c31 7 62-2 84-24M128 244c34 7 67-3 90-27M143 269c28 1 53-8 71-26"
          fill="none" stroke="#75c7c9" stroke-opacity=".7" stroke-width="4"/>
    <path d="M251 79c19 1 37 10 47 25-15-7-31-8-46-2" fill="none" stroke="#75c7c9" stroke-width="6"/>
    <circle cx="288" cy="105" r="7" fill="#d7aa52" stroke="#f0ca78" stroke-width="2"/>
    <circle cx="290" cy="103" r="2" fill="#111820" stroke="none"/>
    <path d="M189 257c7 9 8 19 5 30m19-29c4 10 3 20-2 29m-28-1 11-5 8 6m1-1 10-5 8 5"
