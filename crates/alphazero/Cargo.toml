[package]
name = "huginn-alphazero"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neural policy/value search and self-play support for Huginn"

[dependencies]
huginn-core = { path = "../core" }
huginn-neural = { path = "../neural" }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
