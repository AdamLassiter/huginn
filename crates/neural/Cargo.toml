[package]
name = "huginn-neural"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral multiverse policy/value model for Huginn"

[features]
default = ["cpu", "training"]
cpu = ["burn/ndarray"]
training = ["burn/autodiff"]
vulkan = ["burn/vulkan"]

[dependencies]
base64 = "0.22"
burn = { version = "=0.21.0", default-features = false, features = ["std"] }
huginn-core = { path = "../core" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rand_chacha = "0.9"
tempfile = "3"

[lints]
workspace = true
